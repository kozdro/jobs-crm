name: Application CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, lint, "format:check", "test:unit", "test:boundaries"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v24.22.2"
          test "$(pnpm --version)" = "12.16.1"
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.check }}
        run: pnpm run '${{ matrix.check }}'

  production:
    name: Production build and smoke
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Install pinned browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Production build
        run: pnpm build
      - name: Foundation browser smoke
        run: pnpm test:e2e:foundation
      - name: Server secret canary
        run: pnpm test:canary

  harness:
    name: Harness checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify adapters
        run: python3 harness/scripts/sync.py --check
      - name: Verify harness structure
        run: python3 harness/scripts/check.py
      - name: Harness regression tests
        run: python3 -m unittest discover -s harness/scripts -p 'test_*.py' -v

  f2:
    name: F2 local migrations and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Verify pinned toolchain and local engine
        run: |
          test "$(node --version)" = "v24.22.2"
          test "$(pnpm --version)" = "12.16.1"
          docker version
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Complete synthetic F2 suite
        run: pnpm test:integration:f2
      - name: Remove only owned disposable F2 targets
        if: ${{ always() }}
        run: node scripts/db/cleanup.ts

  f3:
    name: F3 native Auth and browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Verify toolchain and local engine
        run: |
          test "$(node --version)" = "v24.22.2"
          test "$(pnpm --version)" = "12.16.1"
          docker version
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Install pinned browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Complete F3 synthetic Auth and HTTPS browser suite
        run: pnpm test:auth:f3
      - name: Remove only owned disposable F3 targets
        if: ${{ always() }}
        run: node scripts/auth/cleanup.ts

  required:
    name: Foundation required
    if: ${{ always() }}
    needs: [checks, production, harness, f2, f3]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every dependency to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failed:
              raise SystemExit(f"Required checks did not succeed: {failed}")
          print("All foundation checks succeeded")
          PYTHON

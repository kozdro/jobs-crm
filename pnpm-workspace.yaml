saveExact: true
strictPeerDependencies: true
engineStrict: true
pmOnFail: error
strictDepBuilds: true
# Native resolver binaries are supplied as pinned optional packages; deny fallback downloads.
allowBuilds:
  unrs-resolver@1.12.2: false
# Refuse silent changes to the release-age policy during future installs.
minimumReleaseAgeStrict: true
